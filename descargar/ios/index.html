<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>NoteSurfing · Abriendo la tienda…</title>
  <noscript><meta http-equiv="refresh" content="0; url=https://apps.apple.com/mx/app/notesurfing/id6761601378"></noscript>
  <style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#cbd5e1;font:16px system-ui,-apple-system,sans-serif}a{color:#10a697}</style>
</head>
<body>
  <p>Abriendo la tienda… <a id="go" href="https://apps.apple.com/mx/app/notesurfing/id6761601378">toca aquí si no abre</a></p>
  <script>
    // Paso intermedio entre el sitio y la tienda: Cloudflare cuenta esta página
    // como "clic en la insignia" y aquí se etiqueta el link con la fuente del
    // anuncio (utm_* que el sitio reenvía en la URL).
    (function () {
      var q = new URLSearchParams(location.search);
      var source = q.get('utm_source') || 'web';
      var campaign = q.get('utm_campaign') || '';
      var url = 'https://apps.apple.com/mx/app/notesurfing/id6761601378?ct=' + encodeURIComponent((source + (campaign ? '-' + campaign : '')).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40));
      document.getElementById('go').href = url;
      // Dejar que el beacon de Cloudflare registre la visita antes de salir.
      var go = function () { setTimeout(function () { location.replace(url); }, 400); };
      if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
    })();
  </script>
<!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "9af2535e5bd248c894cbbb906febbbe5"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
